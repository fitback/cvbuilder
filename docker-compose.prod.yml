services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: resume
      POSTGRES_PASSWORD: ${DB_PASSWORD:-resume_prod}
      POSTGRES_DB: resume_matcher
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resume -d resume_matcher"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    expose:
      - "3001"
    environment:
      DATABASE_URL: postgresql://resume:${DB_PASSWORD:-resume_prod}@postgres:5432/resume_matcher
      REDIS_URL: redis://redis:6379
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      # Prisma auto-detects the correct engine for the target platform (node:22-bookworm-slim = OpenSSL 3.x).
      # Explicit overrides removed — the hardcoded OpenSSL 1.1 paths would crash on Debian 12.
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      RESUME_STORAGE_PATH: /data/resumes
      ALIPAY_APP_ID: ${ALIPAY_APP_ID}
      ALIPAY_PRIVATE_KEY: ${ALIPAY_PRIVATE_KEY}
      ALIPAY_PUBLIC_KEY: ${ALIPAY_PUBLIC_KEY}
      ALIPAY_NOTIFY_URL: ${ALIPAY_NOTIFY_URL}
      ALIPAY_RETURN_URL: ${ALIPAY_RETURN_URL}
    volumes:
      - resume_data:/data/resumes
      - payment_qr_data:/data/payment-qr
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgresql://resume:${DB_PASSWORD:-resume_prod}@postgres:5432/resume_matcher
      REDIS_URL: redis://redis:6379
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      # Prisma auto-detects the correct engine (node:22-bookworm-slim = OpenSSL 3.x).
      RESUME_STORAGE_PATH: /data/resumes
    volumes:
      - resume_data:/data/resumes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: /api
    expose:
      - "3000"
    environment:
      NEXT_PUBLIC_API_URL: /api
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt/live/cvbuilder.ltd:/etc/letsencrypt/live/cvbuilder.ltd:ro
      - /etc/letsencrypt/archive/cvbuilder.ltd:/etc/letsencrypt/archive/cvbuilder.ltd:ro
      - /etc/letsencrypt/renewal/cvbuilder.ltd.conf:/etc/letsencrypt/renewal/cvbuilder.ltd.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  resume_data:
  payment_qr_data:
