# Rate limiting zones
limit_req_zone  $binary_remote_addr zone=api_global:10m rate=30r/s;
limit_req_zone  $binary_remote_addr zone=api_auth:10m   rate=3r/m;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# Cache path for GET responses
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:100m
                 max_size=1g inactive=60m;

server {
    listen 80;
    server_name _;

    # Deploy health check — keep reachable over HTTP so CI stays green
    location = /api/health {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # HTTP → HTTPS redirect
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name cvbuilder.ltd www.cvbuilder.ltd;

    ssl_certificate     /etc/letsencrypt/live/cvbuilder.ltd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cvbuilder.ltd/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Global limits
    client_max_body_size 6m;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # Frontend
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets with long cache (Next.js content-hashed files)
    location /_next/static/ {
        proxy_pass http://frontend:3000;
        proxy_cache api_cache;
        proxy_cache_valid 200 30d;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Current-user lookup — called on every page load, must not share the
    # login brute-force bucket (api_auth is 3r/m)
    location = /api/auth/me {
        rewrite ^/api/auth/(.*) /auth/$1 break;
        proxy_pass http://backend:3001;
        limit_req zone=api_global burst=15 nodelay;
        limit_conn conn_per_ip 20;

        # GET response micro-cache (5s), per-user via Authorization key
        proxy_cache api_cache;
        proxy_cache_valid 200 5s;
        proxy_cache_key "$request_method|$request_uri|$http_authorization";
        proxy_cache_bypass $http_cache_control;
        proxy_cache_methods GET HEAD;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Auth routes — strictest limits
    location /api/auth/ {
        rewrite ^/api/auth/(.*) /auth/$1 break;
        proxy_pass http://backend:3001;
        limit_req zone=api_auth burst=2 nodelay;
        limit_conn conn_per_ip 5;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API — general limits + GET micro-cache
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://backend:3001;
        limit_req zone=api_global burst=15 nodelay;
        limit_conn conn_per_ip 20;

        # GET response micro-cache (5s)
        proxy_cache api_cache;
        proxy_cache_valid 200 5s;
        proxy_cache_key "$request_method|$request_uri|$http_authorization";
        proxy_cache_bypass $http_cache_control;
        proxy_cache_methods GET HEAD;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
